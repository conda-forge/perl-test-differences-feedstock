{% set name = "perl-test-differences" %}
{% set version = "0.72" %}
{% set sha256 = "648844b9dcb7dae6f9b5a15c9359d0f09de247a624b65c4620ebff249558f913" %}

package:
  name: {{ name }}
  version: "{{ version }}"

source:
  url: https://cpan.metacpan.org/authors/id/D/DC/DCANTRELL/Test-Differences-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: generic
  number: 1
  run_exports:
    weak:
      - {{ name }} ={{ version }}

requirements:
  build:
    - make
  host:
    - perl
    - perl-capture-tiny
    - perl-text-diff
  run:
    - perl
    - perl-text-diff        # has no run export defined
    - perl-capture-tiny

test:
  imports:
    - Test::Differences

about:
  home: https://metacpan.org/pod/Test::Differences
  license: GPL-1.0-or-later OR Artistic-1.0-Perl
  license_file:
    - {{ environ["PREFIX"] }}/lib/perl5/core_perl/pod/perlartistic.pod
    - {{ environ["PREFIX"] }}/lib/perl5/core_perl/pod/perlgpl.pod
  summary: Test strings and data structures and show differences if not ok

extra:
  recipe-maintainers:
    - xileF1337
    - cbrueffer
